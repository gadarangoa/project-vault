                - generic [ref=e605]: "## Getting Started ### Speckit After install Speckit initialize into your project ```plaintext specify init . --integration codex ``` use your AI Coding agent of your preference: [Supported AI Coding Agent Integrations | Spec Kit Documentation](https://github.github.io/spec-kit/reference/integrations.html) then use the following basic commands: `/speckit.constitution` : Create or update project governing principles and development guidelines **Alternative**: Openspec follow the instructions here --&gt; [Fission-AI/OpenSpec: Spec-driven development (SDD) for AI coding assistants.](https://github.com/Fission-AI/OpenSpec/) ### Graphify\\*\\*\\*\\* After install, in your code assitant use: ```plaintext /graphify . graphify install --project --platform codex ``` **Alternative**: you can use Graft instead, follow instructions here --&gt; [NanoNets/Graft: Turbocharge Claude Code, Cursor, Codex, Gemini &amp; every coding agent: faster, cheaper, with contextual understanding specific to your codebase.](https://github.com/nanonets/graft#quick-start) ### Agent Skills Add agents skills for your project. **General skills** ```plaintext npx autoskills npx skills add https://github.com/vercel-labs/skills --skill find-skills npx skills add https://github.com/anthropics/skills --skill skill-creator npx skills add https://github.com/obra/superpowers --skill brainstorming npx skills add upstash/context7 ``` **Frontend Skills** ```plaintext # Design npx skills add Leonxlnx/taste-skill npx impeccable install pnpm dlx skills add shadcn/ui npx skills add vercel/ai-elements npx skills add vercel/ai npx skills add https://github.com/nextlevelbuilder/ui-ux-pro-max-skill --skill ui-ux-pro-max npx skills add https://github.com/anthropics/skills --skill frontend-design # React npx skills add https://github.com/vercel-labs/agent-skills --skill vercel-composition-patterns npx skills add https://github.com/vercel-labs/agent-skills --skill web-design-guidelines ``` **Backend skills** ```plaintext npx skills add https://github.com/affaan-m/ecc --skill backend-patterns npx skills add https://github.com/wshobson/agents --skill fastapi-templates npx skills add https://github.com/affaan-m/ecc --skill fastapi-patterns ``` **Framework skills** ```plaintext npx skills add deepgram/deepgram-python-sdk npx skills add elevenlabs/skills ``` **Loop Engeneering** ```plaintext # One front door — init + doctor + status npx @cobusgreyling/loop init . --pattern daily-triage --tool codex npx @cobusgreyling/loop doctor . ``` ### **Spec-Driven Development** Apply SDD using these basic commands: `/speckit.specify` : Define what you want to build (requirements and user stories) `/speckit.plan` : Create technical implementation plans with your chosen tech stack `/speckit.tasks` : Generate actionable task lists for implementation `/speckit.implement` : Excute all tasks to build the feature according to the plan `/speckit.converge` : Assess the codebase against spec/plan/tasks and append remaining work as new tasks **Azure devops** ```plaintext { \"servers\": { \"ado-remote-mcp\": { \"url\": \"https://mcp.dev.azure.com/kognia\", \"type\": \"http\" } } } ```"